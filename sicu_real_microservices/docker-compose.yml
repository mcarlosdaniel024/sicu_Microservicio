services:
  mysql:
    image: mysql:8.0
    container_name: sicu_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sicu_db
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d

  frontend:
    build: .
    container_name: sicu_frontend
    ports:
      - "8080:80"
    volumes:
      - ./services/frontend/app:/var/www/html
    depends_on:
      - mysql

  auth-service:
    build: .
    container_name: sicu_auth
    ports:
      - "8081:80"
    volumes:
      - ./services/auth-service:/var/www/html
    depends_on:
      - mysql

  entry-service:
    build: .
    container_name: sicu_entry
    ports:
      - "8082:80"
    volumes:
      - ./services/entry-service:/var/www/html
    depends_on:
      - mysql

  exit-service:
    build: .
    container_name: sicu_exit
    ports:
      - "8083:80"
    volumes:
      - ./services/exit-service:/var/www/html
    depends_on:
      - mysql

  audit-service:
    image: node:18
    working_dir: /app
    command: sh -c "npm install && node server.js"
    container_name: sicu_audit
    ports:
      - "3000:3000"
    volumes:
      - ./services/audit-service:/app